name: quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Generated localizations match the ARB files
        run: |
          (cd packages/app_localizations && flutter gen-l10n)
          git diff --exit-code -- packages/app_localizations/lib/src/generated
      - run: dart format --output=none --set-exit-if-changed apps packages services tool test
      - run: flutter analyze --no-pub
      - run: dart run tool/quality_gate.dart
      - run: bash tool/run_tests.sh
      - run: python3 -m unittest discover -s tool/tests
      - run: flutter build apk --release
        working-directory: apps/bank_app
      - run: flutter build apk --release
        working-directory: apps/fines_app
      - run: flutter build web --release --no-pub --no-web-resources-cdn
        working-directory: apps/ui_catalog
      - uses: actions/upload-artifact@v4
        with:
          name: demo-builds
          path: |
            apps/bank_app/build/app/outputs/flutter-apk/app-release.apk
            apps/fines_app/build/app/outputs/flutter-apk/app-release.apk
            apps/ui_catalog/build/web
